name: FileForge CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/fileforge

jobs:
  # ── 1. Lint & Test Frontend ─────────────────
  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check & build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:5000

  # ── 2. Lint & Test Node Backend ─────────────
  test-node:
    name: Test Node API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-node
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend-node/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: node --check src/app.js

  # ── 3. Test Python Backend ──────────────────
  test-python:
    name: Test Python API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-python
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install fastapi uvicorn python-multipart aiofiles httpx python-dotenv Pillow PyYAML pandas openpyxl lxml xmltodict dicttoxml

      - name: Syntax check
        run: python -m py_compile main.py app/routes/convert.py app/services/data_converter.py

  # ── 4. Build & Push Docker Images ───────────
  build-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [test-frontend, test-node, test-python]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:latest
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            VITE_RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Node API
        uses: docker/build-push-action@v6
        with:
          context: ./backend-node
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api-node:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Python API
        uses: docker/build-push-action@v6
        with:
          context: ./backend-python
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api-python:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 5. Deploy to VPS / Render ───────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - uses: actions/checkout@v4

      # Option A: Deploy to a VPS via SSH
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/fileforge
            git pull origin main
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
            echo "✅ FileForge deployed at $(date)"

      # Option B: Trigger Render deploy hooks (uncomment if using Render)
      # - name: Trigger Render deploys
      #   run: |
      #     curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_NODE }}"
      #     curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_PYTHON }}"
