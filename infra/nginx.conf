worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;

    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=upload:10m rate=5r/m;

    # Client body size for file uploads
    client_max_body_size 55M;
    client_body_timeout 120s;

    # ── Upstream servers ──────────────────────
    upstream node_api {
        server api-node:5000;
        keepalive 32;
    }

    upstream python_api {
        server api-python:8000;
        keepalive 16;
    }

    upstream frontend_app {
        server frontend:80;
        keepalive 16;
    }

    # ── Main server block ──────────────────────
    server {
        listen 80;
        server_name _;

        # Redirect to HTTPS in production (uncomment when SSL is set up)
        # return 301 https://$host$request_uri;

        # Node.js API routes
        location /api/auth/ {
            limit_req zone=auth burst=20 nodelay;
            proxy_pass http://node_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cookie_path / "/; SameSite=Lax";
        }

        location /api/convert/upload {
            limit_req zone=upload burst=5 nodelay;
            client_max_body_size 55M;
            proxy_pass http://node_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /api/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://node_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cookie_path / "/; SameSite=Lax";
        }

        # Python conversion downloads
        location /convert/download/ {
            proxy_pass http://python_api;
            proxy_set_header Host $host;
            proxy_read_timeout 60s;
        }

        # Health checks
        location /health {
            proxy_pass http://node_api;
            access_log off;
        }

        # Frontend (catch-all)
        location / {
            proxy_pass http://frontend_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # SPA routing support
            proxy_intercept_errors on;
            error_page 404 = /index.html;
        }
    }

    # ── HTTPS server (uncomment + add certs for production) ──
    # server {
    #     listen 443 ssl http2;
    #     server_name yourdomain.com;
    #     ssl_certificate /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #     # ... same location blocks as above ...
    # }
}
